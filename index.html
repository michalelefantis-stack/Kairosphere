
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- SEO Meta Tags -->

    <meta name="author" content="Kairosphere" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://kairosphere.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kairosphere.app/" />
    <meta property="og:title" content="KAIROSPHERE — Explore the World's Most Extraordinary Cultural Events" />
    <meta property="og:description" content="An interactive cultural intelligence platform mapping 340+ rituals, festivals, ceremonies, and natural phenomena across 100+ countries. Real-time tracking, AI analysis, and 3D globe exploration." />
    <meta property="og:image" content="https://kairosphere.app/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KAIROSPHERE — Cultural Intelligence Platform" />

    <!-- LLM Discovery -->
    <link rel="alternate" type="text/plain" href="/llms.txt" title="LLM Context" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d0c0b" />
    <meta name="color-scheme" content="light dark" />
    <meta name="darkreader-lock" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <!-- TailwindCSS: now compiled at build time via @tailwindcss/vite -->
    <!-- Leaflet's stylesheet is bundled from node_modules in index.tsx, not
         fetched from a CDN: the packaged mobile app has no guarantee of
         reaching unpkg, and a missing map stylesheet renders the map unusable. -->
    <style>
      body, html, #root {
        height: 100%;
        margin: 0;
        background-color: #0d0c0b;
        color: #f2efe9;
        overflow: hidden;
      }
      .leaflet-container {
        background: #0d0c0b !important;
      }
      /* Animate panel */
      @keyframes slideIn {
        from { transform: translateX(-100%); }
        to { transform: translateX(0); }
      }
      .animate-in {
        animation: slideIn 0.3s ease-out forwards;
      }
    </style>

<script>
  if (localStorage.getItem('kairos_theme') === 'light') {
    document.documentElement.classList.add('light-mode');
  }
</script>
<!-- index.css is imported from index.tsx so Vite compiles Tailwind into it. -->

</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  <script>
    // Skip service worker in Capacitor native WebView — it intercepts
    // Capacitor's internal asset server and causes a black screen.
    if ('serviceWorker' in navigator && !window.Capacitor) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(
          (registration) => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          },
          (err) => {
            console.log('ServiceWorker registration failed: ', err);
          }
        );
      });
    }
    // If a service worker was previously registered inside Capacitor, unregister it
    if ('serviceWorker' in navigator && window.Capacitor) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        registrations.forEach(r => r.unregister());
      });
    }
  </script>
</body>
</html>
