  <circle cx="50" cy="50" r="34" fill="none" stroke="#f5a524" stroke-width="1.5" stroke-opacity="0.25"/>
  <circle cx="50" cy="50" r="28" fill="none" stroke="#f5a524" stroke-width="1" stroke-dasharray="4 8" stroke-opacity="0.6"/>
  <path d="M50 16V84M16 50H84" stroke="#f5a524" stroke-width="1" stroke-opacity="0.35"/>
  <circle cx="50" cy="50" r="9" fill="#f5a524"/>
  <circle cx="50" cy="50" r="15" fill="none" stroke="#f5a524" stroke-width="2"/>
</svg>
