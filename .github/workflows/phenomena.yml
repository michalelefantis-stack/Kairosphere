name: Update phenomena feed

# Rebuilds the live-events feed on a schedule and publishes it.
#
# Cadence is set by how fast each tier actually moves: aurora is a ~30-minute
# nowcast, blooms and citizen-science signals shift daily, deterministic
# astronomy never moves at all. Every two hours keeps the fastest layer
# honest without burning minutes on maths that cannot change.
#
# Cost: ~90s per run, ~12 runs/day, so roughly 550 minutes/month — inside the
# 2,000 free minutes a private repo gets. Public repos are unlimited, and can
# drop the cron to '*/30 * * * *' if the aurora layer deserves it.

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:        # a manual "run now" button
    inputs:
      force:
        description: 'Publish even if the gate reports a regression'
        type: boolean
        default: false

concurrency:
  group: phenomena-feed
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Lifted to the job so the monitor step can test whether it exists.
      # `secrets` is not one of the contexts a step-level `if:` can read.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run tests
        # The deterministic tiers are pure maths; if that breaks, publishing a
        # feed built from it is worse than publishing nothing.
        run: python -m unittest discover -s pipeline/tests -t .

      - name: Build feed
        id: build
        run: python -m pipeline.run ${{ inputs.force && '--force' || '' }}

      - name: Refresh local news reports
        # Skipped entirely without a key. The monitor still runs without one,
        # but marks every feed "unfiltered" — and utils/localReports refuses to
        # render those, on the grounds that nothing has been checked for
        # relevance or for being somebody's private funeral. Running it anyway
        # force-added 43,000 lines of raw headlines past .gitignore, for a
        # panel that will not display them, on every scheduled run.
        if: env.GEMINI_API_KEY != ''
        run: python -m pipeline.monitor

      - name: Summarise
        if: always()
        run: |
          if [ -f public/data/phenomena.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          feed = json.loads(pathlib.Path('public/data/phenomena.json').read_text(encoding='utf-8'))
          counts = feed.get('counts', {})
          print(f"### Phenomena feed\n")
          print(f"- generated: `{feed.get('generatedAt')}`")
          print(f"- events: **{counts.get('total')}** ({counts.get('active')} active)")
          print(f"- by tier: `{counts.get('byTier')}`")
          print(f"- by confidence: `{counts.get('byBand')}`")
          queue = pathlib.Path('pipeline/out/review_queue.json')
          if queue.exists():
              items = json.loads(queue.read_text(encoding='utf-8')).get('items', [])
              if items:
                  print(f"\n### Needs human review ({len(items)})\n")
                  for item in items:
                      print(f"- **{item['name']}** — {'; '.join(item['reasons'])}")
          PY
          fi

      - name: Commit the feed
        run: |
          git config user.name  'kairosphere-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/data/phenomena.json public/data/live_events.geojson
          # -f because public/data/local is gitignored: it is generated, and
          # only worth versioning once a classifier has vouched for it.
          if [ -d public/data/local ]; then git add -f public/data/local/; fi
          if git diff --cached --quiet; then
            echo 'Feed unchanged; nothing to commit.'
            exit 0
          fi
          git commit -m "chore(data): refresh phenomena feed [skip ci]"
          # The schedule can overlap a human push; rebase rather than fail.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Stage content for Pages
        if: vars.PUBLISH_PAGES == 'true'
        # The whole data directory, not just the live feed. VITE_CONTENT_BASE_URL
        # points the app at this origin for the catalogue, photographs,
        # briefings and airports as well — which is what makes a wrong photo or
        # a corrected date a file upload instead of a release. Publishing only
        # the feed would leave the app fetching four 404s and silently falling
        # back to whatever it was built with.
        run: |
          mkdir -p _site
          cp -r public/data _site/data
          echo "staged:" && ls -1sh _site/data

      - uses: actions/upload-pages-artifact@v3
        if: vars.PUBLISH_PAGES == 'true'
        with:
          path: _site

  # Serves the content at https://<user>.github.io/<repo>/data/ with permissive
  # CORS — the live feed, and everything VITE_CONTENT_BASE_URL resolves.
  # Opt in by setting the repository variable PUBLISH_PAGES to 'true' and
  # enabling Pages (Settings > Pages > Source: GitHub Actions).
  publish:
    needs: build
    if: vars.PUBLISH_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
